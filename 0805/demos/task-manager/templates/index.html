<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto py-12 px-4">

        <!-- Header -->
        <h1 class="text-3xl font-bold text-gray-800 mb-8">TaskFlow</h1>

        <!-- Add task form -->
        <form action="/tasks" method="POST" class="flex gap-2 mb-8">
            <input type="text" name="title" placeholder="New task…" required
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
            <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg transition">
                Add
            </button>
        </form>

        <!-- Task list -->
        {% if tasks %}
        <ul class="space-y-3">
            {% for task in tasks %}
            <li class="bg-white rounded-lg shadow-sm px-5 py-4 flex items-center justify-between">
                <div>
                    <span class="text-gray-800 font-medium">{{ task.title }}</span>
                    <span class="ml-3 text-xs px-2 py-0.5 rounded-full
              {% if task.status == 'done' %}bg-green-100 text-green-700
              {% else %}bg-yellow-100 text-yellow-700{% endif %}">
                        {{ task.status }}
                    </span>
                </div>
                <!-- Delete button uses fetch() to call DELETE /tasks/<id> -->
                <button onclick="deleteTask({{ task.id }})" class="text-red-400 hover:text-red-600 text-sm transition">
                    Delete
                </button>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="text-gray-500 text-center mt-16">No tasks yet — add one above!</p>
        {% endif %}

    </div>

    <script>
        async function deleteTask(id) {
            await fetch(`/tasks/${id}`, { method: "DELETE" });
            location.reload();
        }
    </script>

</body>

</html>
