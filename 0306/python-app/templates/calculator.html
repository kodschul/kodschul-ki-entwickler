<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <style>
      body {
        font-family:
          Segoe UI,
          sans-serif;
        margin: 2rem;
        max-width: 520px;
      }
      form {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Calculator</h1>
    <form method="post">
      <input type="number" step="any" name="a" placeholder="a" required />
      <span>+</span>
      <input type="number" step="any" name="b" placeholder="b" required />
      <button type="submit">Compute</button>
    </form>

    {% if result is not none %}
    <p>Result: {{ result }}</p>
    {% endif %}

    <p><a href="{{ url_for('index') }}">Back to todos</a></p>
  </body>
</html>
