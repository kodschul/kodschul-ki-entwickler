<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 py-12 px-4">
  <div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6">Simple Calculator</h1>
    <form method="POST" class="bg-white rounded-xl shadow p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Number A</label>
        <input type="number" name="a" step="any" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Number B</label>
        <input type="number" name="b" step="any" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
        Add
      </button>
    </form>
    {% if result is not none %}
    <div class="mt-6 bg-white rounded-xl shadow p-4 text-center">
      <p class="text-gray-500 text-sm">Result</p>
      <p class="text-3xl font-bold text-indigo-700">{{ result }}</p>
    </div>
    {% endif %}
    <a href="{{ url_for('index') }}" class="mt-6 inline-block text-indigo-600 hover:underline text-sm">← Back to Todos</a>
  </div>
</body>
</html>
