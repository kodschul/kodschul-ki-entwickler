<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Todos</h1>

    <form action="{{ url_for('add') }}" method="post" class="flex gap-2 mb-6">
      <input
        type="text"
        name="text"
        placeholder="What needs to be done?"
        class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        required
      >
      <input
        type="date"
        name="due_date"
        class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        required
      >
      <button
        type="submit"
        class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded"
      >
        Add
      </button>
    </form>

    {% if todos %}
      <ul class="space-y-2">
        {% for todo in todos %}
          <li class="border rounded px-3 py-2 {{ 'border-red-300' if todo.overdue else 'border-gray-200' }}">
            {% if todo.id == edit_id %}
              <form action="{{ url_for('edit', id=todo.id) }}" method="post" class="flex gap-2">
                <input
                  type="text"
                  name="text"
                  value="{{ todo.text }}"
                  class="flex-1 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  required
                >
                <input
                  type="date"
                  name="due_date"
                  value="{{ todo.due_date }}"
                  class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  required
                >
                <button type="submit" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Save</button>
                <a href="{{ url_for('index') }}" class="text-gray-500 hover:text-gray-700 text-sm font-medium self-center">Cancel</a>
              </form>
            {% else %}
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-gray-800">{{ todo.text }}</span>
                  <span class="text-sm ml-2 {{ 'text-red-600 font-medium' if todo.overdue else 'text-gray-500' }}">
                    Due {{ todo.due_date }}
                  </span>
                </div>
                <div class="flex gap-3">
                  <a href="{{ url_for('index') }}?edit={{ todo.id }}" class="text-blue-500 hover:text-blue-700 text-sm font-medium">Edit</a>
                  <form action="{{ url_for('delete', id=todo.id) }}" method="post">
                    <button
                      type="submit"
                      class="text-red-500 hover:text-red-700 text-sm font-medium"
                    >
                      Delete
                    </button>
                  </form>
                </div>
              </div>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-gray-500 text-center">No todos yet</p>
    {% endif %}
  </div>
</body>
</html>
